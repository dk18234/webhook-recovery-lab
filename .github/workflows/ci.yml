name: Verify recovery contracts
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ci-admin-token-at-least-24-characters
      WEBHOOK_SECRET: ci-webhook-secret-at-least-24-characters
      DATABASE_PASSWORD: ci-local-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify against real embedded PostgreSQL
        run: ./mvnw -B verify
      - name: Verify browser simulation
        run: node --test scripts/simulation.test.mjs
      - name: Check browser modules
        run: npm run check
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and exercise the container stack
        run: |
          docker compose up --build --detach
          if ! curl --fail --retry 60 --retry-all-errors --retry-connrefused --retry-delay 2 --max-time 5 http://localhost:8080/actuator/health; then
            docker compose logs --no-color
            exit 1
          fi
          python3 scripts/verify_http.py
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports/
            target/*.jar
            test-results/
