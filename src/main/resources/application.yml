spring:
  application:
    name: webhook-recovery-lab
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/webhook_lab}
    username: ${DATABASE_USER:webhook}
    password: ${DATABASE_PASSWORD:webhook_local}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
lab:
  admin-token: ${ADMIN_TOKEN:local-admin-token-change-before-hosting}
  webhook-secret: ${WEBHOOK_SECRET:local-webhook-secret-change-before-hosting}
  worker-enabled: ${WORKER_ENABLED:true}
  demo-enabled: ${DEMO_ENABLED:true}
  poll-ms: ${WORKER_POLL_MS:750}
  lease-seconds: ${LEASE_SECONDS:15}
  retry-base-ms: ${RETRY_BASE_MS:2000}
  max-attempts: ${MAX_ATTEMPTS:5}
